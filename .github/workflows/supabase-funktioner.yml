# Driftsätter AI-funktionerna (Supabase Edge Functions) och kontrollerar att de startar och svarar.
# Körs när funktionerna ändras på main, eller för hand under Actions → Supabase-funktioner → Run workflow.
# Kräver repo-hemligheten SUPABASE_ACCESS_TOKEN (personlig åtkomstnyckel från supabase.com/dashboard/account/tokens).
name: Supabase-funktioner

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-funktioner.yml"
  workflow_dispatch:
    inputs:
      funktioner:
        description: "Vilka funktioner (mellanslag mellan namnen)"
        default: "ask-vreta capture-agent story-agent marketplace-agent"

concurrency:
  group: supabase-funktioner
  cancel-in-progress: false

jobs:
  driftsatt:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wxwbhawiraygoyytyhgu
      # Den publika nyckeln (samma som i appen) – behövs bara för röktestet
      PUBLIC_KEY: sb_publishable_Mzcoi2K9BSzFUBSuOo2czw_AiUIX6Bu
      FUNKTIONER: ${{ github.event.inputs.funktioner || 'ask-vreta capture-agent story-agent marketplace-agent' }}
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera åtkomstnyckeln
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repo-hemligheten SUPABASE_ACCESS_TOKEN saknas. Skapa en nyckel på https://supabase.com/dashboard/account/tokens och lägg in den under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Vad får nyckeln göra?
        run: |
          # Skriver bara HTTP-koder, aldrig nyckeln eller svar med hemligheter
          api="https://api.supabase.com/v1"
          for p in "organizations" "projects" "projects/$PROJECT_REF" "projects/$PROJECT_REF/functions"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/$p")
            echo "GET /v1/$p → $code"
          done
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/projects" | jq -r '.[]? | "Projekt som nyckeln ser: \(.name) (\(.id))"' || true
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api/projects/$PROJECT_REF/functions" | jq -r 'if type=="array" then (.[] | "Funktion: \(.slug) v\(.version) \(.status)") else "Svar: \(.message // .)" end' || true

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Driftsätt
        run: |
          for f in $FUNKTIONER; do
            echo "::group::$f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done

      - name: Röktest – startar funktionerna och svarar de?
        run: |
          set -euo pipefail
          base="https://$PROJECT_REF.supabase.co"
          # En anonym inloggning ger en riktig JWT utan medlemskap: funktionerna ska svara med sina egna
          # felkoder (unauthorized/forbidden). Ett startfel ger i stället 5xx eller ett BOOT_ERROR.
          token=$(curl -sf -X POST "$base/auth/v1/signup" -H "apikey: $PUBLIC_KEY" -H "Content-Type: application/json" -d '{}' | jq -r .access_token)
          [ -n "$token" ] && [ "$token" != "null" ] || { echo "::error::Kunde inte logga in anonymt (är anonym inloggning påslagen?)"; exit 1; }
          fel=0
          for f in $FUNKTIONER; do
            code=$(curl -s -o svar.json -w '%{http_code}' -X POST "$base/functions/v1/$f" \
              -H "apikey: $PUBLIC_KEY" -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{}')
            svar=$(cat svar.json)
            echo "$f → $code $svar"
            case "$code:$svar" in
              401:*unauthorized*|403:*forbidden*) echo "✓ $f startar och svarar" ;;
              *) echo "::error::$f svarade oväntat: $code $svar"; fel=1 ;;
            esac
          done
          exit $fel
